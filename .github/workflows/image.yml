name: docker image

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t undistortme:ci .

      - name: Smoke test inside the image (real FSL phantom run)
        # UNDISTORTME_REQUIRE_FSL makes a missing/broken FSL install FAIL
        # this step instead of skipping the test.
        run: |
          docker run --rm -e UNDISTORTME_REQUIRE_FSL=1 \
            --entrypoint python undistortme:ci \
            -m pytest /src/undistortme/tests/test_smoke_fsl.py \
            -m "slow or needs_fsl" -v

      - name: Run the image as documented (own uid, bind mount, real entrypoint)
        shell: bash
        run: |
          set -euo pipefail
          IMG=undistortme:ci
          cd "$(mktemp -d)"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/data $IMG \
              -o /src/undistortme/examples -t -c /src/undistortme/configs/pervol.cnf \
              --derivdir /data/derivatives
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/data $IMG \
              -o /src/undistortme/examples -t -s -m -c /src/undistortme/configs/perslice_1.cnf \
              --derivdir /data/derivatives
          docker run --rm -v "$PWD":/data --entrypoint python $IMG \
              /src/undistortme/examples/verify_example.py /data/derivatives
          test -z "$(find derivatives ! -uid "$(id -u)" -print -quit)" || \
              { echo "::error::derivatives contains files not owned by the runner uid"; exit 1; }
          test -n "$(find derivatives/undistortme -mindepth 1 -print -quit)" || \
              { echo "::error::derivatives/undistortme is empty"; exit 1; }

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMG=ghcr.io/${{ github.repository }}
          VERSION=${GITHUB_REF_NAME#v}
          docker tag undistortme:ci $IMG:$VERSION
          docker tag undistortme:ci $IMG:latest
          docker push $IMG:$VERSION
          docker push $IMG:latest
